a{color:inherit}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:5;background:rgba(251,246,238,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:8px;height:50px}

.wbox{margin-left:auto;position:relative}.wchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 9px;font-size:13px;white-space:nowrap}.wchip #wnow{font-weight:600}.wchip #wnow:empty{display:none}
.wpop{position:absolute;right:-60px;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgba(40,30,10,.15);padding:10px;z-index:20;width:min(330px,92vw)}.wpop .w-days{margin-top:6px}.wpop h4{margin:0;font-size:13.5px}

.lbtn{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 9px 4px 6px;font-size:13px;font-weight:600}
.flag{width:22px;height:15px;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.12);flex:none;display:block}
.lmenu{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgba(40,30,10,.15);padding:6px;min-width:168px;z-index:20}
.lmenu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 10px;border-radius:9px;font-size:15px;text-align:left}
.lmenu button.on{background:#f4ede2;font-weight:600}
.back{border:1px solid var(--line);background:#fff;border-radius:999px;width:32px;height:32px;font-size:15px;display:none;align-items:center;justify-content:center;padding:0;flex:none}
.back.show{display:inline-flex}
.langs{display:flex;gap:4px;padding:0 0 8px;overflow-x:auto;scrollbar-width:none}
.langs::-webkit-scrollbar{display:none}
.lang{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.lang.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.navlinks{display:flex;gap:6px;margin-left:auto}
.navlinks a{font-size:13px;text-decoration:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;white-space:nowrap}
.hero{padding:18px 0 4px}
.hero h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(27px,6vw,44px);line-height:1.05;letter-spacing:-.03em;margin:0 0 8px}
.hero h1 span{color:var(--orange)}
.hero p{margin:0;color:var(--muted);max-width:560px}
.search{margin:14px 0 4px;position:relative}
.search input{width:100%;padding:13px 14px 13px 42px;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:16px;outline:none}
.search input:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(242,106,27,.15)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.5}
.weather{margin:14px 0 4px;background:linear-gradient(135deg,#e7f3f8,#fff 70%);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.w-now{display:flex;align-items:center;gap:12px}
.w-now .big{font-size:40px;line-height:1}
.w-now .t{font-family:"Bricolage Grotesque",sans-serif;font-size:30px;font-weight:800}
.w-now small{color:var(--muted);display:block;font-size:13px}
.w-days{display:flex;gap:8px;overflow-x:auto;margin-top:12px;scrollbar-width:none}

.w-day b{display:block;font-size:12px;color:var(--muted);font-weight:600}
.w-day .e{font-size:22px;display:block;margin:2px 0}
.w-day .r{color:var(--sea);font-size:11.5px}
.w-src{font-size:11.5px;color:var(--muted);margin-top:8px}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:14px 0}
.qcard{display:flex;align-items:center;gap:10px;padding:14px;border-radius:var(--radius);text-decoration:none;color:#fff;box-shadow:var(--shadow);min-height:72px}
.qcard .ico{font-size:28px}

.qcard small{opacity:.85;font-size:12.5px}
.q-night{background:linear-gradient(120deg,#1d1a16,#3a2516 60%,#7a3a12)}
.q-beach{background:linear-gradient(120deg,#0f6e8c,#2aa3c4)}
.q-alm{background:linear-gradient(120deg,#8a5a12,#d39a2a)}
.q-fallas{background:linear-gradient(120deg,#9b1c1c,#f26a1b)}
.q-traffic{background:linear-gradient(120deg,#2f3a45,#5b6b7a)}
.q-travel{background:linear-gradient(120deg,#3b2a7a,#6a5acd)}
.q-rent{background:linear-gradient(120deg,#0b4f6c,#1f8fbf)}
.q-lug{background:linear-gradient(120deg,#4a4a4a,#7d7d7d)}
.q-health{background:linear-gradient(120deg,#a3201b,#e0524a)}
.q-med{background:linear-gradient(120deg,#5a2d0c,#a8642a)}
.q-act{background:linear-gradient(120deg,#0e6b4f,#2fb380)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:8px 0 24px}
.tile{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:var(--radius);background:var(--card);border:1px solid var(--line);text-decoration:none;box-shadow:var(--shadow);min-height:112px}
.tile .ico{font-size:30px;line-height:1}

.tile small{color:var(--muted);font-size:13px;line-height:1.3}
.view-head{padding:16px 0 4px}

.view-head p{margin:4px 0 0;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;padding:6px 0 24px}

.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px}
.tag{padding:2px 8px;border-radius:999px;background:#f4ede2;color:#5a4f43}
.tag.open{background:#e3f4ea;color:var(--green);font-weight:600}
.tag.closed{background:#fbe9e7;color:var(--red)}
.tag.free{background:#e6f1f6;color:var(--sea);font-weight:600}
.tag.date{background:var(--orange);color:#fff;font-weight:600}
.tag.new{background:#efe6ff;color:#5b3fa6;font-weight:600}
.card p{margin:0;color:#3b352e;font-size:14.5px}
.tip{font-size:13.5px;background:#fff6ec;border-left:3px solid var(--orange);padding:7px 10px;border-radius:6px;color:#5a3a1c}
.hours{font-size:13px;color:var(--muted)}.music{font-size:13.5px;font-weight:600;color:var(--orange);margin:2px 0 4px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:4px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;text-decoration:none;font-size:14px;font-weight:500}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.danger{color:var(--red)}
.empty{padding:26px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:var(--radius)}
.subhead{font-weight:600;margin:18px 0 4px;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.article{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);margin:8px 0 6px}

.countdown{font-family:"Bricolage Grotesque",sans-serif;font-size:22px;font-weight:800;color:var(--red);margin:8px 0}
.timeline{display:flex;flex-direction:column;gap:8px;margin:8px 0}

.tl .d{flex:none;min-width:86px;font-weight:700;color:var(--red);font-size:14px}

form.admin label{display:grid;gap:4px;font-size:13.5px;font-weight:600;color:#4a4239}
form.admin input,form.admin select,form.admin textarea{border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-weight:400;background:#fffdf9}
form.admin .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{font-size:13px;color:var(--muted)}
.ok{color:var(--green);font-weight:600}.err{color:var(--red);font-weight:600}

.tag.dist{background:#eef4ff;color:#2b4fa3;font-weight:600}

.sheet{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px 26px;max-height:85vh;overflow:auto}
.sheet h3{margin:0 0 4px;font-family:"Bricolage Grotesque",sans-serif;font-size:21px}
.sheet .gps{width:100%;margin:12px 0;padding:12px;border-radius:12px;border:0;background:var(--orange);color:#fff;font-weight:600;font-size:15px}
.zones{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.zones button{border:1px solid var(--line);background:#fffdf9;border-radius:12px;padding:10px;text-align:left;font-size:14px}
.zones button.on{border-color:var(--ink);background:#f4ede2;font-weight:600}

/* ===== DARK THEME ===== */
html[data-theme=dark]{color-scheme:dark;--bg:#14120f;--card:#1f1c18;--ink:#f2ece3;--muted:#a59a8c;--line:#35302a;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);--sea:#4fb3d4;--green:#4cc27e;--red:#ef6b5c}
html[data-theme=dark] header.top{background:rgba(20,18,15,.92)}
html[data-theme=dark] :is(.wchip,.wpop,.lbtn,.lmenu,.back,.lang,.navlinks a,.search input,.w-day,.chip,.btn,.empty,.article,.tl,form.admin,.sheet,.thbtn){background:#1f1c18;color:var(--ink)}
html[data-theme=dark] :is(.tile,.card){background:var(--card)}
html[data-theme=dark] :is(.lmenu button.on,.zones button.on,.tag){background:#2c2822;color:#d9cfc2}
html[data-theme=dark] :is(.chip.on,.lang.on){background:var(--ink);color:#14120f}
html[data-theme=dark] .btn.primary{background:var(--orange);color:#fff}
html[data-theme=dark] .tag.open{background:#173826}
html[data-theme=dark] .tag.closed{background:#3d1d19}
html[data-theme=dark] .tag.free{background:#15323d}
html[data-theme=dark] .tag.date{background:var(--orange);color:#fff}
html[data-theme=dark] .tag.new{background:#2e2547;color:#c4b2ff}
html[data-theme=dark] .tag.dist{background:#1d2a45;color:#9fb8ff}
html[data-theme=dark] .card p{color:#d6cdc1}
html[data-theme=dark] .tip{background:#2e2216;color:#f0c79c}
html[data-theme=dark] form.admin label{color:#d6cdc1}
html[data-theme=dark] :is(form.admin input,form.admin select,form.admin textarea,.zones button){background:#17150f;color:var(--ink)}
html[data-theme=dark] .weather{background:linear-gradient(135deg,#17303a,#1f1c18 70%)}
html[data-theme=dark] .flag{box-shadow:0 0 0 1px rgba(255,255,255,.18)}

html[data-theme=dark] .donate{background:linear-gradient(120deg,#2e2216,#3a2717);border-color:#5a3d22}html[data-theme=dark] .donate p{color:#f0c79c}
.thbtn{border:1px solid var(--line);background:#fff;border-radius:999px;width:32px;height:30px;padding:0;font-size:15px;display:inline-flex;align-items:center;justify-content:center;flex:none}
</style>

const DAYS=["Su","Mo","Tu","We","Th","Fr","Sa"];
function vlcNow(){
  const f=new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Madrid",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",weekday:"short",hour12:false});
  const o={};f.formatToParts(new Date()).forEach(p=>o[p.type]=p.value);
  const wd=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(o.weekday),hh=+o.hour%24;
  return {wd,mins:hh*60+(+o.minute),iso:`${o.year}-${o.month}-${o.day}`,hh,mm:o.minute};
}
const addDays=(iso,n)=>{const d=new Date(iso+"T12:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const daysBetween=(a,b)=>Math.round((new Date(b+"T12:00:00Z")-new Date(a+"T12:00:00Z"))/864e5);
const toMin=x=>{const[a,b]=x.split(":").map(Number);return a*60+b};
function parseHours(h){
  if(!h)return null;const out=[[],[],[],[],[],[],[]];
  try{h.split(";").forEach(rule=>{rule=rule.trim();if(!rule)return;const[dp,tp]=rule.split(/\s+/);const days=new Set();
    dp.split(",").forEach(seg=>{if(seg.includes("-")){const[a,b]=seg.split("-").map(x=>DAYS.indexOf(x));for(let i=a;;i=(i+1)%7){days.add(i);if(i===b)break;}}else days.add(DAYS.indexOf(seg));});
    tp.split(",").forEach(r=>{let[s,e]=r.split("-").map(toMin);if(e<=s)e+=1440;days.forEach(d=>out[d].push([s,e]));});});}catch(e){return null}
  return out;
}
function isOpen(h,now){const w=parseHours(h);if(!w)return null;const t=now.mins,d=now.wd,p=(d+6)%7;
  return w[d].some(([s,e])=>t>=s&&t<e)||w[p].some(([s,e])=>e>1440&&t+1440>=s&&t+1440<e);}
function opensTonight(h,now){const w=parseHours(h);if(!w)return null;return w[now.wd].some(([s,e])=>e>1200&&s<1800);}
function niceHours(h){
  if(!h)return"";if(/^Mo-Su 00:00-24:00$/.test(h))return t("open24");
  const dn=DAYN[lang];const map={Su:dn[0],Mo:dn[1],Tu:dn[2],We:dn[3],Th:dn[4],Fr:dn[5],Sa:dn[6]};
  return h.replace(/\b(2[4-9]|3\d):(\d\d)/g,(m,a,b)=>String(a-24).padStart(2,"0")+":"+b)

}

  app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{app.querySelectorAll("[data-t]").forEach(x=>x.classList.toggle("on",x===b));document.getElementById("fPlace").classList.toggle("hidden",b.dataset.t!=="place");document.getElementById("fEvent").classList.toggle("hidden",b.dataset.t!=="event")});
  const save=async(form,type,msg)=>{const fd=Object.fromEntries(new FormData(form).entries());const doc={type,status:"pending",created:new Date().toISOString(),lang};
    Object.entries(fd).forEach(([k,v])=>{v=String(v).trim();if(v!=="")doc[k]=v});if(doc.p!==undefined)doc.p=+doc.p;
    const m=document.getElementById(msg);m.textContent="…";try{await DB.collection("submissions").add(doc);m.innerHTML=`<span class="ok">✔ ${at("saved")}</span>`;form.reset();await loadExtra();listPending()}catch(e){m.innerHTML=`<span class="err">✖ ${esc(e&&e.message||e)}</span>`}};
  document.getElementById("fPlace").onsubmit=e=>{e.preventDefault();save(e.target,"place","msgP")};
  document.getElementById("fEvent").onsubmit=e=>{e.preventDefault();save(e.target,"event","msgE")};
  listPending();
}
let SUBS=[];
function listPending(){const el=document.getElementById("pend");if(!el)return;
  const items=SUBS.filter(s=>s.data.status!=="merged");
  el.innerHTML=items.length?items.map(s=>`<article class="card"><div class="meta"><span class="tag">${s.data.type==="event"?"🎟️ "+at("event"):"📍 "+at("place")}</span><span class="tag">${esc((s.data.created||"").slice(0,10))}</span></div><h3>${esc(s.data.n)}</h3><p>${esc(s.data.d)}</p><div class="actions"><button class="btn danger" data-del="${esc(s.id)}">🗑️ ${at("del")}</button></div></article>`).join(""):`<div class="empty">${at("none")}</div>`;
  el.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{b.disabled=true;try{await DB.collection("submissions").doc(b.dataset.del).delete();await loadExtra();listPending()}catch(e){b.disabled=false}});
}
async function loadExtra(){
  if(!DB)return;try{const snap=await DB.collection("submissions").get();SUBS=snap.docs.map(d=>({id:d.id,data:d.data()||{}}));
    const pend=SUBS.filter(s=>s.data.status!=="merged");
    EXTRA.places=pend.filter(s=>s.data.type==="place"&&s.data.n).map(s=>({id:"sub-"+s.id,_new:true,c:s.data.c,n:s.data.n,a:s.data.a,p:s.data.p,h:s.data.h||"",u:s.data.u,q:s.data.q,d:s.data.d,t:s.data.t}));
    EXTRA.events=pend.filter(s=>s.data.type==="event"&&s.data.n&&s.data.s).map(s=>({id:"sub-"+s.id,_new:true,n:s.data.n,s:s.data.s,e:s.data.e,time:s.data.time,v:s.data.v||"Valencia",k:s.data.k||"other",d:s.data.d,u:s.data.u}));
  }catch(e){}
}

/* =================== ROUTER & BOOT =================== */
function renderLangs(){const box=document.getElementById("langs");const cur=LANGS.find(l=>l[0]===lang);
  box.innerHTML=`<button class="lbtn" id="lbtn" aria-haspopup="true" aria-label="Language">${FLAG[lang]}${cur[1]} ▾</button><div class="lmenu hidden" id="lmenu">${LANGS.map(([c])=>`<button data-l="${c}" class="${c===lang?"on":""}">${FLAG[c]}${LNAME[c]}</button>`).join("")}</div>`;
  const menu=document.getElementById("lmenu");
  document.getElementById("lbtn").onclick=e=>{e.stopPropagation();menu.classList.toggle("hidden")};
  menu.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem("vn_lang",lang)}catch(e){};document.documentElement.lang=HTML_LANG[lang]||lang;renderChrome();route(true)});}
document.addEventListener("click",()=>{const m=document.getElementById("lmenu");if(m)m.classList.add("hidden");const w=document.getElementById("wpop");if(w)w.classList.add("hidden")});
function renderChrome(){try{document.getElementById("cyear").textContent=new Date().getFullYear()}catch(e){}renderLangs();document.getElementById("foot1").textContent=t("feet1");document.getElementById("foot2").textContent=t("foot2");tick();weatherHead();themeBtn();donateBox();}
function route(keep){
  const id=(location.hash||"").slice(1);document.getElementById("back").classList.toggle("show",!!id);
  if(!keep){state.openNow=false;state.area="all"}
  if(!id)renderHome();else if(id==="tonight")renderTonight();else if(id==="events")renderEvents();else if(id==="info")renderInfo();else if(id==="almuerzo")renderAlmuerzo();else if(id==="fallas")renderFallas();else if(id==="traffic")renderTraffic();else if(id==="travel")renderTravel();else if(id==="activities")renderActivities();else if(id==="rentals"||id==="luggage"||id==="health")renderGroups(id);else if(id==="admin")renderAdmin();
  else if(CATS.some(c=>c.id===id))renderCategory(id);else renderHome();
  if(!keep)window.scrollTo(0,0);
}
function tick(){const n=vlcNow();document.getElementById("clock").textContent=`${DAYN[lang][n.wd]} ${n.hh}:${n.mm}`;}
function donateBox(){const el=document.getElementById("donate"),u=DATA.content?.donate?.u;if(!el)return;el.innerHTML=u?`<div class="donate"><span style="font-size:28px">☕</span><p>${t("donateTxt")}</p><a class="kofi" href="${esc(u)}" target="_blank" rel="noopener"><span class="cup">☕</span>${t("donateBtn")}</a></div>`:""}
function themeBtn(){const d=document.documentElement.dataset.theme==="dark",b=document.getElementById("thbtn");b.textContent=d?"☀️":"🌙";b.title=t(d?"lightMode":"darkMode")}
document.getElementById("thbtn").onclick=()=>{const n=document.documentElement.dataset.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=n;try{localStorage.setItem("vn_theme",n)}catch(e){};themeBtn()};
document.getElementById("back").onclick=()=>{location.hash=""};
window.addEventListener("hashchange",()=>route(false));
async function getJSON(p){const r=await fetch(p,{cache:"no-cache"});if(!r.ok)throw new Error(p+" "+r.status);return r.json()}
(async function boot(){
  document.documentElement.lang=HTML_LANG[lang]||lang;renderChrome();setInterval(tick,30000);
  try{const[pl,ev,ct,wx]=await Promise.all([getJSON("data/places.json"),getJSON("data/events.json"),getJSON("data/content.json"),getJSON("data/weather.json").catch(()=>null)]);
    DATA.places=pl.places||[];DATA.events=ev.events||[];DATA.content=ct;DATA.weather=wx;weatherHead();donateBox();}
  catch(e){app.innerHTML=`<div class="empty" style="margin-top:30px">Could not load data. Please reload.</div>`;return}
  route(false);
  if(!(window.claude&&window.claude.use)){const al=document.getElementById("adminLink");if(al){al.previousSibling&&al.previousSibling.nodeType===3&&(al.previousSibling.textContent=al.previousSibling.textContent.replace(/\s*·\s*$/,""));al.remove()}}
  // optional capabilities (owner/admin features + live additions)
  try{if(window.claude&&window.claude.use){const[u,d]=await Promise.all([window.claude.use("user"),window.claude.use("db")]);USER=u;DB=d;
    if(DB){await loadExtra();if((EXTRA.places.length||EXTRA.events.length)&&location.hash!=="#admin")route(true)}
    if(location.hash==="#admin")renderAdmin();}}catch(e){}
})();
</script>
